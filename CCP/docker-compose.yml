version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: ids-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_MODE=sqlite
      - DEBUG=False
      - PORT=8000
    volumes:
      - ids_data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ids-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  ids_data:

